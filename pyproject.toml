[project]
name = "time-series-foundation"
version = "0.1.0"
description = "Reading group: time series foundation models vs classical, ML and Bayesian forecasting on simulated restaurant demand"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas[pyarrow]>=2.2",
    "matplotlib>=3.9",
    "statsforecast>=2.0",
    "lightgbm>=4.5",
    "pymc>=5.20",
    "nutpie>=0.15",
    "arviz>=0.20",
    "torch>=2.5",
    "chronos-forecasting>=2.2",
    "timesfm[torch]>=2.0",
    "tqdm>=4.66",
    "scikit-learn>=1.5",
    "jax>=0.4.30",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "jupytext>=1.16",
]

[tool.uv]
package = false
# Resolve against PyPI as it looked on this date so `uv lock` is reproducible.
exclude-newer = "2026-10-01T00:00:00Z"
